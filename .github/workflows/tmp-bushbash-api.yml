name: Temporary BushBash API fetch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public challenge metadata
        run: |
          set -eu
          curl -fsS -A 'Mozilla/5.0' -H 'Accept: application/json' 'https://bushbash.cssa.club/api/challenges' -o bushbash_challenges.json
          cat bushbash_challenges.json
      - name: Commit temporary output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bushbash_challenges.json
          git commit -m 'chore: temporary BushBash API output'
          git push
